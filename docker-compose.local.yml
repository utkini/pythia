name: pl

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pythia
      POSTGRES_USER: pythia
      POSTGRES_PASSWORD: pythia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythia -d pythia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pythia-local-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://pythia:pythia@db:5432/pythia
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  bot:
    build: .
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://pythia:pythia@db:5432/pythia
      INSTAGRAM_SESSION_FILE: /run/secrets/instagram.session
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - pythia-local-work:/tmp/pythia
      - ./secrets:/run/secrets:ro

volumes:
  pythia-local-postgres:
  pythia-local-work:
